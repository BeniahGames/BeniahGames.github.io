    <span class="sep"></span>
    <span class="stat"><span class="dot"></span>SYS ONLINE</span>

    <div class="language-selector" id="language-selector">
      <button class="language-btn" id="language-btn" aria-label="Language"><span class="flag" id="current-flag">🇺🇸</span><span id="current-lang">EN</span></button>
      <div class="language-dropdown" id="language-dropdown">
        <a href="#" class="language-option active" data-lang="en"><span>English</span></a>
        <a href="#" class="language-option" data-lang="nl"><span>Nederlands</span></a>
        <a href="#" class="language-option" data-lang="de"><span>Deutsch</span></a>
        <a href="#" class="language-option" data-lang="it"><span>Italiano</span></a>
        <a href="#" class="language-option" data-lang="es"><span>Español</span></a>
        <a href="#" class="language-option" data-lang="ja"><span>日本語</span></a>
      </div>
    </div>

    <div class="volume-control" id="volume-control">
      <button class="volume-btn" id="volume-btn" aria-label="Sound"><svg viewBox="0 0 24 24" class="volume-icon" id="volume-icon" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Zm4.2 2.4a1 1 0 0 0-1.3 1.5 4.5 4.5 0 0 1 0 6.2 1 1 0 0 0 1.4 1.4 6.5 6.5 0 0 0 0-9.1Z"/></svg></button>
      <div class="volume-slider-container" id="volume-slider-container">
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="0" aria-label="Volume">
        <div class="volume-percentage" id="volume-percentage">0%</div>
      </div>
    </div>

    <div class="user-icon-container">
      <button id="user-icon" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.2 0-8 2.1-8 4.7V21a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2.3C20 16.1 16.2 14 12 14Z"/></svg></button>
      <div class="user-icon-dropdown" id="user-icon-dropdown" style="display:none">
        <a href="/user/" data-translate="nav.profile">Profile</a>
        <a href="#" id="user-icon-logout" data-translate="nav.logout">Logout</a>
      </div>
    </div>
    <div class="user-menu" id="auth-button" style="display:none">
      <div class="user-dropdown"><a href="/user/" data-translate="nav.profile">Profile</a><a href="#" id="logout-btn" data-translate="nav.logout">Logout</a></div>
    </div>
  </header>

  <main class="crt">
    <div class="screen">
      <div class="out" id="out" role="log" aria-live="polite"></div>
      <form class="prompt" id="prompt" autocomplete="off" onsubmit="return false">
        <span class="sign">&gt;</span>
        <label class="sr-only" for="cmdline">Terminal command</label>
        <input id="cmdline" name="cmdline" type="text" spellcheck="false" autocapitalize="characters"
               placeholder="type a command — try HELP">
      </form>
    </div>
  </main>

  <!-- the contact form lives here until CONTACT asks for it -->
  <template id="contact-template">
    <form id="contact-form">
      <div class="row2">
        <div class="field">
          <label for="contact-name" data-translate="contact.form.name">Name</label>
          <input type="text" id="contact-name" name="name" required>
        </div>
        <div class="field">
          <label for="contact-email" data-translate="contact.form.email">Your Email</label>
          <input type="email" id="contact-email" name="email" required>
        </div>
      </div>
      <div class="field">
        <label for="contact-subject" data-translate="contact.form.subject">Subject</label>
        <input type="text" id="contact-subject" name="subject" required>
      </div>
      <div class="field">
        <label for="contact-message" data-translate="contact.form.message">Message</label>
        <textarea id="contact-message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn" data-translate="contact.form.send">Send Message</button>
      <div id="form-status" class="form-status" style="display:none"></div>
    </form>
  </template>

  <div id="signup-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div class="auth-tabs">
        <button class="tab-btn active" id="login-tab" data-translate="login.title">Login</button>
        <button class="tab-btn" id="signup-tab" data-translate="signup.title">Sign Up</button>
      </div>
      <div id="login-form-container" class="form-container active">
        <form id="login-form">
          <div class="form-group"><label for="login-email" data-translate="login.email">Email:</label><input type="email" id="login-email" name="email" required></div>
          <div class="form-group"><label for="login-password" data-translate="login.password">Password:</label><input type="password" id="login-password" name="password" required></div>
          <button type="submit" data-translate="login.submit">Login</button>
          <div id="login-message" class="message"></div>
        </form>
      </div>
      <div id="signup-form-container" class="form-container">
        <form id="signup-form">
          <div class="form-group"><label for="email" data-translate="signup.email">Email:</label><input type="email" id="email" name="email" required></div>
          <div class="form-group"><label for="password" data-translate="signup.password">Password:</label><input type="password" id="password" name="password" required></div>
          <div class="form-group"><label for="confirm-password" data-translate="signup.confirm_password">Confirm Password:</label><input type="password" id="confirm-password" name="confirm-password" required></div>

          <button type="submit" data-translate="signup.submit">Sign Up</button>
          <div id="signup-message" class="message"></div>
        </form>
      </div>
    </div>

    // Audio Manager System
    (() => {
      let audioContext;
      
      // Load saved volume level from localStorage
      let masterVolume = 0; // Default to muted
      try {
        const savedVolume = localStorage.getItem('sound-level');
        if (savedVolume !== null) {
          const parsedVolume = parseFloat(savedVolume);
          // Validate the saved volume is within acceptable range
          if (!isNaN(parsedVolume) && parsedVolume >= 0 && parsedVolume <= 100) {
            masterVolume = parsedVolume;
          }
        }
      } catch (error) {
        console.warn('Failed to load saved volume level:', error);
        // masterVolume remains 0 (muted) as fallback
      }
      
      const sounds = {};

      // Initialize audio context on first user interaction
      function initAudioContext() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
      }

      // Load and cache audio files
      async function loadSound(name, url) {
        // Don't reload if already loaded
        if (sounds[name]) {
          console.log(`Sound already loaded: ${name}`);
          return;
        }
        
        try {
          console.log(`Loading sound: ${name} from ${url}`);
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText} for ${url}`);
          }
          const arrayBuffer = await response.arrayBuffer();
          const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
          sounds[name] = audioBuffer;
          console.log(`Successfully loaded sound: ${name}, duration: ${audioBuffer.duration}s`);
        } catch (error) {
          console.error(`Failed to load sound: ${name} from ${url}`, error);
        }
      }

      // Play sound with volume control
      async function playSound(name, volume = 1) {
        console.log(`Attempting to play sound: ${name}, volume: ${masterVolume}%, audioContext: ${!!audioContext}, soundLoaded: ${!!sounds[name]}`);
        
        // Auto-initialize audio if volume > 0 but audio not ready
        if (masterVolume > 0 && (!audioContext || !sounds[name])) {
          console.log('Auto-initializing audio for immediate playback...');
          try {
            if (!audioContext) {
              initAudioContext();
            }
            if (!sounds[name]) {
              // Load sound on demand based on name
              const soundPaths = {
                'welcomeClick': 'assets/0110000101110101011001000110100101101111/FUI Ping Simple High.wav',
                'alienOpen': 'assets/0110000101110101011001000110100101101111/Alien Interface Open-1.wav',
                'alienClose': 'assets/0110000101110101011001000110100101101111/Alien Interface Close-1.wav',
                'gadgetOpen': 'assets/0110000101110101011001000110100101101111/Small High-Tech Gadget Open.wav',
                'gadgetClose': 'assets/0110000101110101011001000110100101101111/Small High-Tech Gadget Close.wav',
                'faqOpen': 'assets/0110000101110101011001000110100101101111/Micro Clicks Motion.wav',
                'faqClose': 'assets/0110000101110101011001000110100101101111/Micro Mechanism Extend Short.wav',
                'holographicOpen': 'assets/0110000101110101011001000110100101101111/Holographic Open Panel.wav'
              };
              if (soundPaths[name]) {
                await loadSound(name, soundPaths[name]);
              }
            }
          } catch (error) {
            console.error('Failed to auto-initialize audio:', error);
            return;
          }
        }
        
        if (!audioContext) {
          console.warn('Audio context not initialized');
          return;
        }
        
        if (!sounds[name]) {
          console.warn(`Sound not loaded: ${name}`);
          return;
        }
        
        if (masterVolume === 0) {
          console.log('Volume is muted, not playing sound');
          return;
        }
        
        try {
          const source = audioContext.createBufferSource();
          const gainNode = audioContext.createGain();
          
          source.buffer = sounds[name];
          source.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          gainNode.gain.value = (masterVolume / 100) * volume;
          source.start();
          console.log(`Playing sound: ${name} at volume ${gainNode.gain.value}`);
        } catch (error) {
          console.error(`Failed to play sound: ${name}`, error);
        }
      }

      // Volume control UI
      const volumeBtn = document.getElementById('volume-btn');
      const volumeIcon = document.getElementById('volume-icon');
      const volumeSliderContainer = document.getElementById('volume-slider-container');
      const volumeSlider = document.getElementById('volume-slider');
      const volumePercentage = document.getElementById('volume-percentage');

        if (masterVolume === 0) {

          volumeBtn.classList.add('muted');
        } else if (masterVolume < 30) {
          volumeIcon.innerHTML = '<path d="M7 9v6h4l5 5V4l-5 5H7z"/>';
          volumeBtn.classList.remove('muted');
        } else if (masterVolume < 70) {
          volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
          volumeBtn.classList.remove('muted');
        } else {

          volumeBtn.classList.remove('muted');
        }
      }

      function updateVolumeDisplay() {
        volumeSlider.value = masterVolume;
        volumePercentage.textContent = `${masterVolume}%`;
        updateVolumeIcon();
        
        // Save volume level to localStorage
        try {
          localStorage.setItem('sound-level', masterVolume);
        } catch (error) {
          console.warn('Failed to save volume level to localStorage:', error);

      // Volume slider change
      volumeSlider.addEventListener('input', async (e) => {
        masterVolume = parseInt(e.target.value);
        updateVolumeDisplay();
        
        // Initialize audio context and load sounds when user first adjusts volume
        if (!audioContext) {
          initAudioContext();
          await loadSound('welcomeClick', 'assets/0110000101110101011001000110100101101111/FUI Ping Simple High.wav');
        }
      });

      // Volume button interaction - support both click and touch
      const handleVolumeButtonInteraction = async (e) => {
        e.stopPropagation();
        e.preventDefault(); // Prevent double-firing on mobile
        volumeSliderContainer.classList.toggle('show');
        
        // Initialize audio context when user opens volume control

      async function signUpWithUsername({ email, password }) { 
        // 1) Sign up 
        const { data, error } = await supabase.auth.signUp({ email, password }); 
        if (error) throw error; 
      
        // Depending on your project settings, session may be null (email confirmation required) 
        const user = data.user;

        // 2) If no session yet, sign in to get auth so RLS permits the write 
        if (!session) {

          if (signInErr) { 
            // Fall back: show your "Account created successfully, but username could not be saved" message 
            return { partial: true, reason: 'no_session_yet' }; 
          } 
        } 
      
        // 3) Generate a random username and ensure it's unique
        let username = generateRandomUsername();
        let attempts = 0;
        const maxAttempts = 10;
        
        while (attempts < maxAttempts) {
          const isAvailable = await checkUsername(username);
          if (isAvailable) {
            break;
          }
          username = generateRandomUsername();
          attempts++;
        }
        
        if (attempts >= maxAttempts) {
          // If we can't find a unique username after 10 attempts, use timestamp
          username = `User${Date.now()}`;
        }
      
        // 4) Upsert profile row with correct PK = auth user id 
        const { data: userData } = await supabase.auth.getUser(); 
        const uid = userData?.user?.id; 
        if (!uid) return { partial: true, reason: 'no_uid' }; 
      
        const { error: upsertErr } = await supabase

      const input = document.getElementById('cmdline');
      const screen = document.querySelector('.screen');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const GAMES = window.BG_GAMES;
      const COPY = window.BG_COPY;

      let typing = null;          // cancels an in-flight type-out
      const history = [];
      let historyAt = -1;

      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };
      const put = node => { out.appendChild(node); out.scrollTop = out.scrollHeight; return node; };
      const line = (text = '', cls = 'l') => put(el('p', cls, text));
      const gap = () => put(el('div', 'gap'));
      const html = (markup, cls) => { const n = el('div', cls); n.innerHTML = markup; return put(n); };

      // type a line out one character at a time; resolves when done
      function type(text, cls = 'l', speed = 9) {
        const node = put(el('p', cls));
        if (reduced) { node.textContent = text; return Promise.resolve(node); }
        return new Promise(resolve => {
          let i = 0;
          const cursor = el('span', 'cursor');
          node.appendChild(cursor);
          const tick = () => {
            if (typing !== token) return resolve(node);
            i += Math.max(1, Math.round(text.length / 90));
            cursor.remove();
            node.textContent = text.slice(0, i);
            if (i < text.length) { node.appendChild(cursor); out.scrollTop = out.scrollHeight; setTimeout(tick, speed); }
            else resolve(node);
          };
          const token = typing;
          setTimeout(tick, speed);
        });
      }

      const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

      function commandRow(list) {
        const row = el('div', 'cmds');
        list.forEach(name => {
          const b = el('button', 'cmd', name);
          b.type = 'button';
          b.addEventListener('click', () => run(name));
          row.appendChild(b);
        });
        return put(row);
      }

      function clear() { typing = Symbol('run'); out.innerHTML = ''; }

      // ---------------------------------------------------------- screens
      async function home() {
        clear();
        await type('BENIAH.GAMES TERMINAL', 'ttl');
        line('-'.repeat(44), 'l rule');
        gap();
        const dl = el('dl', 'kv');
        [['USER', 'BENIAH GEPTS'], ['LOCATION', 'BELGIUM'], ['CLASS', 'INDIE DEVELOPER']]
          .forEach(([k, v]) => { dl.appendChild(el('dt', null, k + ':')); dl.appendChild(el('dd', null, v)); });
        put(dl);
        gap();
        const dl2 = el('dl', 'kv');
        dl2.appendChild(el('dt', null, 'PLAYING GAMES:')); dl2.appendChild(el('dd', null, '30+ YEARS'));
        dl2.appendChild(el('dt', null, 'MAKING GAMES:'));
        dl2.appendChild(el('dd', 'bar-meter', '█'.repeat(7) + '░'.repeat(3)));
        dl2.appendChild(el('dt', null, 'PROJECTS:')); dl2.appendChild(el('dd', null, GAMES.length + ' IN DEVELOPMENT'));
        dl2.appendChild(el('dt', null, 'SHIPPING TO:')); dl2.appendChild(el('dd', null, 'ANDROID · STEAM'));
        put(dl2);
        gap();
        commandRow(['ABOUT', 'PROJECTS', 'DEVLOG', 'FAQ', 'CONTACT']);
        line('type a command, or HELP for everything this thing knows', 'l faint');
      }

      async function about() {
        clear();
        await type('> ABOUT', 'l hl');
        gap();
        html('<p class="l">Hi, I\'m <span class="hl">Beniah Gepts</span>' + COPY.about1 + '</p>');
        gap();
        html('<p class="l">' + COPY.about2 + '</p>');
        gap();
        const dl = el('dl', 'kv');
        [['BASED IN', 'Belgium'], ['ENGINE', 'Godot'], ['ART', 'Krita · Aseprite · Blender'],
         ['PLATFORMS', 'Android · Steam'], ['PROJECTS', GAMES.length + ' in development']]
          .forEach(([k, v]) => { dl.appendChild(el('dt', null, k + ':')); dl.appendChild(el('dd', null, v)); });
        put(dl);
        gap();
        commandRow(['PROJECTS', 'CONTACT', 'HOME']);
      }

      async function projects() {
        clear();
        await type('> PROJECTS  —  ' + GAMES.length + ' cartridges loaded', 'l hl');
        line('click a cartridge, or type its number, for the full dossier', 'l faint');
        const rack = el('div', 'rack');
        GAMES.forEach((g, i) => {
          const slot = el('div', 'slot');
          const cart = el('button', 'cart');
          cart.type = 'button';
          cart.setAttribute('aria-label', g.name + ' — open dossier');
          cart.innerHTML =
            '<span class="face front"><span class="notch"></span>' +
              '<span class="label">' + esc(g.short) + '<small>' + esc(g.platform) + '</small></span>' +
              '<span class="ridges"></span>' +
              (g.sticker ? '<span class="sticker" style="background-image:url(' + g.sticker + ')"></span>' : '') +
            '</span>' +
            '<span class="face back"></span>' +
            '<span class="face side left"></span><span class="face side right"></span>' +
            '<span class="face cap top"></span><span class="face cap bottom"></span>';
          cart.addEventListener('click', () => dossier(i));
          slot.appendChild(cart);
          slot.appendChild(el('div', 'name', String(i + 1).padStart(2, '0') + '. ' + g.name));
          slot.appendChild(el('div', 'meta', g.genre));
          rack.appendChild(slot);
        });
        put(rack);
        commandRow(['ALL GAMES', 'DEVLOG', 'HOME']);
      }

      function dossier(i) {
        const g = GAMES[i];
        if (!g) return;
        gap();
        line('> LOAD ' + g.name.toUpperCase(), 'l hl');
        const dl = el('dl', 'kv');
        [['TITLE', g.name], ['GENRE', g.genre], ['PLATFORM', g.platform], ['STATUS', g.status]]
          .forEach(([k, v]) => { dl.appendChild(el('dt', null, k + ':')); dl.appendChild(el('dd', null, v)); });
        put(dl);
        html('<p class="l dim">' + (g.lead ? '<span class="hl">' + esc(g.lead) + '</span>' : '') +
             '<span data-translate="' + g.key + '">' + g.desc + '</span></p>');
        if (g.link) html('<p class="link-row"><a href="' + g.link + '">' + g.linkLabel + '</a></p>');
        if (window.applyI18n) window.applyI18n();
        out.scrollTop = out.scrollHeight;
      }

      async function devlog() {
        clear();
        await type('> DEVLOG', 'l hl');
        gap();
        const host = put(el('div'));
        host.innerHTML = '<p class="l faint">reading devlogs/devlogs.json ...</p>';
        try {
          const r = await fetch('./devlogs/devlogs.json?v=' + Date.now());
          const data = await r.json();
          const logs = (data.devlogs || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
          if (!logs.length) { host.innerHTML = '<p class="l dim">No devlog entries available yet.</p>'; }
          else {
            host.innerHTML = logs.slice(0, 5).map(l =>
              '<p class="l"><span class="hl">' + esc(new Date(l.date).toISOString().slice(0, 10)) + '</span>  ' +
              esc(l.title) + '</p><p class="l dim" style="padding-left:12ch">' + esc(l.excerpt) + '</p>').join('');
          }
        } catch (e) {
          host.innerHTML = '<p class="l err">devlog feed unreachable</p>';
        }
        gap();
        html('<p class="link-row"><a href="./devlogs/">OPEN FULL DEVLOG ARCHIVE &rarr;</a></p>');
        gap();
        commandRow(['PROJECTS', 'HOME']);
      }

      async function faq() {
        clear();
        await type('> FAQ', 'l hl');
        gap();
        COPY.faq.forEach(f => {
          const d = el('details', 'q');
          const sum = el('summary'); sum.setAttribute('data-translate', f.qk); sum.textContent = f.q;
          const ans = el('div', 'a'); ans.setAttribute('data-translate', f.ak); ans.innerHTML = f.a;
          d.appendChild(sum); d.appendChild(ans); put(d);
        });
        if (window.applyI18n) window.applyI18n();
        gap();
        commandRow(['CONTACT', 'HOME']);
      }

      async function contact() {
        clear();
        await type('> CONTACT', 'l hl');
        line('open channels', 'l faint');
        gap();
        html('<p class="link-row"><a href="mailto:contact@beniah.games">contact@beniah.games</a>' +
             '<a href="https://discord.gg/PW6UZWtZ7C" target="_blank" rel="noopener">DISCORD SERVER</a></p>');
        gap();
        const form = document.getElementById('contact-template').content.cloneNode(true);
        put(el('div', 'panel')).appendChild(form);
        if (window.applyI18n) window.applyI18n();
        gap();
        commandRow(['ABOUT', 'HOME']);
      }

      async function help() {
        clear();
        await type('> HELP', 'l hl');
        gap();
        const dl = el('dl', 'kv');
        [['ABOUT', 'who is behind this'], ['PROJECTS', 'the cartridge rack'], ['DEVLOG', 'latest development logs'],
         ['FAQ', 'questions people ask'], ['CONTACT', 'send a message'], ['ALL GAMES', 'the full games page'],
         ['PRIVACY', 'privacy policies'], ['DISCORD', 'open the server'], ['LOGIN', 'account access'],
         ['CLEAR', 'wipe the screen'], ['HOME', 'back to the start']]
          .forEach(([k, v]) => { dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', 'dim', v)); });
        put(dl);
        gap();
        line('arrow keys walk back through what you have typed', 'l faint');
      }

      // ---------------------------------------------------------- router
      const ROUTES = {
        HOME: home, ABOUT: about, PROJECTS: projects, GAMES: projects, PROJECT: projects,
        DEVLOG: devlog, DEVLOGS: devlog, FAQ: faq, CONTACT: contact, HELP: help, '?': help,
        CLEAR: async () => { clear(); },
        'ALL GAMES': async () => { line('> opening games/ ...', 'l ok'); location.href = './games/'; },
        PRIVACY: async () => { line('> opening privacy/ ...', 'l ok'); location.href = './privacy/'; },
        DISCORD: async () => { line('> opening discord ...', 'l ok'); window.open('https://discord.gg/PW6UZWtZ7C', '_blank', 'noopener'); },
        LOGIN: async () => { const m = document.getElementById('signup-modal'); if (m) m.classList.add('show'); line('> auth panel open', 'l ok'); },
      };

      async function run(raw) {
        const cmd = String(raw || '').trim().toUpperCase();
        if (!cmd) return;
        typing = Symbol('run');
        if (window.audioManager) window.audioManager.playSound('gadgetOpen');

        // a bare number on the PROJECTS screen opens that cartridge
        if (/^\d+$/.test(cmd) && document.querySelector('.rack')) {
          const i = parseInt(cmd, 10) - 1;
          if (GAMES[i]) return dossier(i);
        }
        const fn = ROUTES[cmd];
        if (fn) return fn();
        line('> ' + cmd, 'l');
        line("command not found: " + cmd + " — type HELP", 'l err');
      }
      window.termRun = run;

      // ---------------------------------------------------------- input
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const v = input.value;
          if (v.trim()) { history.push(v); historyAt = history.length; }
          input.value = '';
          run(v);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (historyAt > 0) { historyAt--; input.value = history[historyAt]; }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyAt < history.length - 1) { historyAt++; input.value = history[historyAt]; }
          else { historyAt = history.length; input.value = ''; }
        }
      });
      // clicking anywhere on the screen puts the caret back in the prompt
      screen.addEventListener('click', e => {
        if (e.target.closest('button, a, input, textarea, summary, details')) return;
        input.focus();
      });

      // ---------------------------------------------------------- boot
      (async () => {
        const boot = [
          'BENIAH.GAMES SYSTEM v5.0 — booting',
          'loading cartridges ......... OK',
          'mounting devlog feed ....... OK',
          'calibrating phosphor ....... OK',
        ];
        for (const b of boot) { await type(b, 'l faint', 6); }
        await new Promise(r => setTimeout(r, reduced ? 0 : 260));
        await home();
        input.focus();
      })();
    })();

  </script>
</body>
</html>
