<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../assets/terminal.css">
</head>
<body data-root="../">
  <header class="bar">
    <a class="brand" href="../" aria-label="Beniah.games"><img src="../assets/Beniah.Games.Logo.png" alt="Beniah.games"></a>
    <span class="sep"></span>
    <nav class="barnav">
      <a class="barlink" href="../">HOME</a>
      <a class="barlink" href="../games/">PROJECTS</a>
      <a class="barlink" href="../devlogs/">DEVLOG</a>
      <a class="barlink on" href="../privacy/">PRIVACY</a>

  <main class="crt">
    <div class="screen">
      <div class="out">
        <div class="page-head">
          <h1>PRIVACY POLICIES</h1>
          <p class="rule">--------------------------------------------</p>
          <p class="sub">Each app has its own policy, written in plain language.</p>

        <a class="policy-row" href="block-crusher/">

        <div id="nav-out"></div>
      </div>
      <form class="prompt" autocomplete="off" onsubmit="return false">
        <span class="sign">&gt;</span>
        <label class="sr-only" for="cmdline">Terminal command</label>
        <input id="cmdline" type="text" spellcheck="false" autocapitalize="characters" placeholder="type a command — try HELP">

    </div>

  <script src="../assets/terminal-nav.js"></script>
