<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy — Beniah.games</title>
  <meta name="description" content="Privacy policies for the apps and games made by Beniah Gepts." />
  <link rel="icon" href="../assets/Beniah.Games.Icon.png" type="image/png" />
  <style>
    :root{
      --bg:#0b0c10; --panel:#14161b; --text:#e9eef6; --muted:#a3adbe;
      --accent:#ffcc00; --accent-2:#ffd84d; --link:#ffcc00; --border:#262b37;
      --glass:linear-gradient(180deg,rgba(26,29,37,.86),rgba(15,17,22,.93));
      --shadow:0 14px 36px rgba(0,0,0,.45);
      --maxw:1180px; --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial,sans-serif;
      background:var(--bg);color:var(--text);line-height:1.7;
      position:relative;z-index:0;overflow-x:hidden;
    }
    .parallax{position:fixed;inset:0;height:100vh;overflow:hidden;z-index:-1}
    .layer{position:absolute;inset:-10%}
    .layer-back{background:url('../assets/bg/bg-space.jpg') no-repeat center center;background-size:cover;opacity:.85}
    .layer-mid{background:url('../assets/bg/bg-stars-far.png') repeat;background-size:320px 320px;opacity:.5}
    .layer-front{background:url('../assets/bg/bg-stars-near.png') repeat;background-size:256px 256px;opacity:.75;
      animation:twinkle 7s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.75}50%{opacity:.42}}

    .container{max-width:var(--maxw);margin:0 auto;padding:0 1.25rem}
    .header{
      position:sticky;top:0;z-index:100;padding:.6rem 0;
      background:linear-gradient(180deg,rgba(11,12,16,.92),rgba(11,12,16,.72));
      border-bottom:1px solid var(--border);backdrop-filter:saturate(160%) blur(12px);
      box-shadow:0 1px 0 rgba(255,204,0,.16),0 10px 30px rgba(0,0,0,.35);
    }
    .nav{display:flex;justify-content:space-between;align-items:center;gap:1rem}
    .brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text);font-weight:700}
    .brand::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(255,204,0,.9)}
    .brand img{height:40px}
    .nav-links{display:flex;gap:1.5rem;list-style:none;margin:0;padding:0}
    .nav-links a{color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-links a:hover{color:var(--accent)}

    main{padding:clamp(2.5rem,6vw,4rem) 0 clamp(3rem,7vw,5rem)}
    .page-header{text-align:center;margin-bottom:clamp(2rem,5vw,3rem)}
    .page-title{
      font-size:clamp(2.1rem,5vw,3rem);margin:0 0 .6rem;letter-spacing:-.03em;line-height:1.05;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .page-subtitle{color:var(--muted);margin:0 auto;max-width:52ch}

    .policy-list{display:grid;gap:1rem;max-width:720px;margin:0 auto;padding:0;list-style:none}
    .policy-card{
      display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
      background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:1.25rem 1.4rem;
      text-decoration:none;color:inherit;transition:transform .25s,border-color .3s,box-shadow .3s;
    }
    .policy-card:hover{transform:translateY(-3px);border-color:rgba(255,204,0,.45);box-shadow:0 18px 44px rgba(0,0,0,.5)}
    .policy-card h2{margin:0;font-size:1.1rem;color:var(--accent);letter-spacing:-.01em}
    .policy-card p{margin:.2rem 0 0;color:var(--muted);font-size:.9rem}
    .policy-card .go{color:var(--accent);font-weight:700;font-size:.9rem;white-space:nowrap}

    .footer{
      border-top:1px solid var(--border);padding:1.75rem 0;text-align:center;color:var(--muted);font-size:.9rem;
      background:linear-gradient(0deg,rgba(11,12,16,.92),rgba(11,12,16,.55));backdrop-filter:blur(10px);
      box-shadow:0 -1px 0 rgba(255,204,0,.14);
    }
    .footer a{color:var(--muted);text-decoration:none}
    .footer a:hover{color:var(--accent)}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
    @media (max-width:768px){
      .nav{flex-wrap:wrap;row-gap:.5rem}
      .nav-links{gap:.85rem;font-size:.85rem;flex-wrap:wrap;justify-content:flex-end}
    }
    @media (max-width:420px){
      .nav-links{gap:.7rem;font-size:.8rem}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    }
  </style>
</head>
<body>
  <div class="parallax" aria-hidden="true">
    <div class="layer layer-back"></div>
    <div class="layer layer-mid"></div>
    <div class="layer layer-front"></div>
  </div>

  <header class="header">
    <div class="container">
      <nav class="nav">
        <a href="../" class="brand">
          <img src="../assets/Beniah.Games.Logo.png" alt="Beniah.games">
        </a>
        <ul class="nav-links">
          <li><a href="../#about">About</a></li>
          <li><a href="../#games">Games</a></li>
          <li><a href="../devlogs/">Devlogs</a></li>
          <li><a href="../#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">Privacy</h1>
        <p class="page-subtitle">Each app has its own privacy policy, written in plain language.</p>
      </div>

      <ul class="policy-list">
        <li>
          <a class="policy-card" href="block-crusher/">
            <span>
              <h2>Block Crusher</h2>
              <p>Android · effective 2 October 2026</p>
            </span>
            <span class="go">Read →</span>
          </a>
        </li>
      </ul>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Beniah Gepts. · <a href="../#contact">Contact</a> · <a href="https://discord.gg/PW6UZWtZ7C" target="_blank" rel="noopener">Discord</a></p>
    </div>
  </footer>
</body>
</html>
