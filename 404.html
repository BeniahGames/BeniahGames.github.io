<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal lost &mdash; Beniah.games</title>
  <link rel="icon" href="/assets/Beniah.Games.Icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/terminal.css">
</head>
<body data-root="/">
  <header class="bar">
    <a class="brand" href="/" aria-label="Beniah.games"><img src="/assets/Beniah.Games.Logo.png" alt="Beniah.games"></a>
    <span class="sep"></span>
    <nav class="barnav">
      <a class="barlink" href="/">HOME</a>
      <a class="barlink" href="/games/">PROJECTS</a>
      <a class="barlink" href="/devlogs/">DEVLOG</a>
    </nav>
  </header>

  <main class="crt">
    <div class="screen">
      <div class="out">
        <p class="l err">ERR 404 &mdash; SIGNAL LOST</p>
        <p class="l rule">--------------------------------------------</p>
        <div class="gap"></div>
        <p class="l dim">The address you asked for is not on this system.</p>
        <p class="l faint">Checking whether it is a user profile, then returning to base ...</p>
        <div class="gap"></div>
        <div class="cmds">
          <button class="cmd" type="button" data-cmd="HOME">HOME</button>
          <button class="cmd" type="button" data-cmd="PROJECTS">PROJECTS</button>
          <button class="cmd" type="button" data-cmd="DEVLOG">DEVLOG</button>
        </div>
        <div id="nav-out"></div>
      </div>
      <form class="prompt" autocomplete="off" onsubmit="return false">
        <span class="sign">&gt;</span>
        <label class="sr-only" for="cmdline">Terminal command</label>
        <input id="cmdline" type="text" spellcheck="false" autocapitalize="characters" placeholder="type a command — try HELP">
      </form>
    </div>
  </main>

    <script>
        (function() {
            // Get the path that caused the 404
            const path = window.location.pathname;
            const pathParts = path.split('/').filter(part => part);
            
            console.log('404 page - Path:', path);
            console.log('404 page - Path parts:', pathParts);
            
            // Check if this looks like a username (single path segment, not a known folder)
            if (pathParts.length === 1) {
                const potentialUsername = pathParts[0];
                const knownPaths = ['games', 'devlogs', 'user', 'assets', 'index.html'];
                
                // If it's not a known path, treat it as a username
                if (!knownPaths.includes(potentialUsername.toLowerCase()) && 
                    !potentialUsername.includes('.')) {
                    
                    console.log('Redirecting to user profile:', potentialUsername);
                    // Redirect to user profile
                    window.location.href = `/user/?u=${potentialUsername}`;
                    return;
                }
            }
            
            // If we get here, it's a real 404 - redirect to home page
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        })();
    </script>

  <script src="/assets/terminal-nav.js"></script>
</body>
</html>
