<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... - Beniah Games</title>
    <style>
        :root{
          --bg:#0b0c10; --text:#e9eef6; --muted:#a3adbe; --accent:#ffcc00;
          --border:#262b37;
        }
        *{box-sizing:border-box}
        body {
            font-family: Inter, ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif;
            background:
              radial-gradient(70% 55% at 78% 16%, rgba(255,204,0,.14), transparent 62%),
              radial-gradient(55% 50% at 10% 90%, rgba(88,110,230,.16), transparent 66%),
              #0b0c10 url('assets/bg/bg-stars-far.png') repeat;
            background-size: auto, auto, 320px 320px;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
        }
        .container {
            text-align: center;
            background: linear-gradient(180deg, rgba(26,29,37,.86), rgba(15,17,22,.93));
            padding: 2.5rem 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            box-shadow: 0 14px 36px rgba(0,0,0,.45);
            max-width: 26rem;
        }
        .container h2 { margin: 0 0 .5rem; font-size: 1.35rem; letter-spacing: -.01em; }
        .container p { margin: 0; color: var(--muted); font-size: .95rem; }
        .spinner {
            border: 3px solid rgba(255, 204, 0, 0.2);
            border-radius: 50%;
            border-top: 3px solid var(--accent);
            width: 38px;
            height: 38px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.25rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 2.5s; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Redirecting...</h2>
        <p>Looking for user profile...</p>
    </div>

    <script>
        (function() {
            // Get the path that caused the 404
            const path = window.location.pathname;
            const pathParts = path.split('/').filter(part => part);
            
            console.log('404 page - Path:', path);
            console.log('404 page - Path parts:', pathParts);
            
            // Check if this looks like a username (single path segment, not a known folder)
            if (pathParts.length === 1) {
                const potentialUsername = pathParts[0];
                const knownPaths = ['games', 'devlogs', 'user', 'assets', 'index.html'];
                
                // If it's not a known path, treat it as a username
                if (!knownPaths.includes(potentialUsername.toLowerCase()) && 
                    !potentialUsername.includes('.')) {
                    
                    console.log('Redirecting to user profile:', potentialUsername);
                    // Redirect to user profile
                    window.location.href = `/user/?u=${potentialUsername}`;
                    return;
                }
            }
            
            // If we get here, it's a real 404 - redirect to home page
            setTimeout(() => {
                window.location.href = '/';
            }, 2000);
        })();
    </script>
</body>
</html>
