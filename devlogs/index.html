<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devlogs &mdash; Beniah.games</title>
  <meta name="description" content="Development logs and behind-the-scenes updates from Beniah.games." />
  <link rel="icon" href="../assets/Beniah.Games.Icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/terminal.css">
</head>
<body data-root="../">
  <header class="bar">
    <a class="brand" href="../" aria-label="Beniah.games"><img src="../assets/Beniah.Games.Logo.png" alt="Beniah.games"></a>
    <span class="sep"></span>
    <nav class="barnav">
      <a class="barlink" href="../">HOME</a>
      <a class="barlink" href="../games/">PROJECTS</a>
      <a class="barlink on" href="../devlogs/">DEVLOG</a>
      <a class="barlink" href="../privacy/">PRIVACY</a>
    </nav>
  </header>

  <main class="crt">
    <div class="screen">
      <div class="out">
        <div class="page-head">
          <h1>DEVELOPMENT LOGS</h1>
          <p class="rule">--------------------------------------------</p>
          <p class="sub">Behind-the-scenes updates from the workbench.</p>
        </div>

        <div class="filter-buttons">
          <button class="filter-btn active" data-game="all">ALL GAMES</button>
        </div>

        <div class="devlogs-grid" id="devlogs-container"></div>

        <div class="empty-state" id="empty-state" style="display:none">
          <h3>NO DEVLOGS YET</h3>
          <p>Check back soon for development updates.</p>
        </div>
        <div class="gap"></div>
        <div class="cmds"><button class="cmd" type="button" data-cmd="HOME">HOME</button><button class="cmd" type="button" data-cmd="PROJECTS">PROJECTS</button></div>
        <div id="nav-out"></div>
      </div>
      <form class="prompt" autocomplete="off" onsubmit="return false">
        <span class="sign">&gt;</span>
        <label class="sr-only" for="cmdline">Terminal command</label>
        <input id="cmdline" type="text" spellcheck="false" autocapitalize="characters" placeholder="type a command — try HELP">
      </form>
    </div>
  </main>
    <script>
    let devlogs = [];
    let games = [];

    // Load devlog data from JSON
    async function loadDevlogs() {
      try {
        const response = await fetch('./devlogs.json?v=' + Date.now());
        const data = await response.json();
        devlogs = data.devlogs || [];
        games = data.games || [];
        
        // Sort devlogs by date (newest first)
        devlogs.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        // Populate filter buttons
        populateFilterButtons();
        
        // Initial render
        renderDevlogs();
        
        // Make latest devlog available globally
        window.latestDevlog = devlogs[0] || null;
        
      } catch (error) {
        console.error('Failed to load devlogs:', error);
        document.getElementById('empty-state').style.display = 'block';
      }
    }

    // Populate filter buttons based on available games
    function populateFilterButtons() {
      const filterButtons = document.querySelector('.filter-buttons');
      const uniqueGames = [...new Set(devlogs.map(log => log.game))];
      
      uniqueGames.forEach(game => {
        if (game !== 'General') {
          const button = document.createElement('button');
          button.className = 'filter-btn';
          button.setAttribute('data-game', game.toLowerCase());
          button.textContent = game;
          filterButtons.appendChild(button);
        }
      });
    }

    // Render devlogs
    function renderDevlogs(filteredLogs = devlogs) {
      const container = document.getElementById('devlogs-container');
      const emptyState = document.getElementById('empty-state');
      
      if (filteredLogs.length === 0) {
        container.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      
      container.style.display = 'grid';
      emptyState.style.display = 'none';
      
      container.innerHTML = filteredLogs.map(log => `
        <article class="devlog-card">
          <div class="devlog-meta">
            <span class="devlog-game">${log.game}</span>
            <span class="devlog-date">${new Date(log.date).toLocaleDateString('en-US', { 
              year: 'numeric', 
              month: 'long', 
              day: 'numeric' 
            })}</span>
          </div>
          <h2 class="devlog-title">
            <a href="${log.content}">${log.title}</a>
          </h2>
          <p class="devlog-excerpt">${log.excerpt}</p>
          <div class="devlog-tags">
            ${log.tags.map(tag => `<span class="devlog-tag">${tag}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }

    // Filter functionality
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        // Update active button
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        
        // Filter devlogs
        const selectedGame = e.target.getAttribute('data-game');
        const filtered = selectedGame === 'all' 
          ? devlogs 
          : devlogs.filter(log => log.game.toLowerCase() === selectedGame);
        
        renderDevlogs(filtered);
      }
    });

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', loadDevlogs);

    // Export function for main page
    window.getLatestDevlog = () => window.latestDevlog || null;
  </script>


  <script src="../assets/terminal-nav.js"></script>
</body>
</html>
